# Training recipe — written 3 Nov, thresholds frozen 11 Nov.
# Authoritative gate numbers live in configs/thresholds.yaml.
# This file records the SFT/DPO knobs so the article and the code cannot drift.

model:
  base: CohereLabs/tiny-aya-global      # 3.35B, 8k context, CC-BY-NC-4.0
  load_in_4bit: true
  bnb_quant_type: nf4
  forbidden: [tiny-aya-base, tiny-aya-fire, tiny-aya-water, tiny-aya-earth, aya-expanse-8b, aya-expanse-32b]

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear
  bias: none

sft_v0:
  data: data/train_clean/expert_traces.jsonl
  eval: data/dev/expert_traces.jsonl
  # 400 traces / batch 1 / grad-accum 8 / 5 epochs = 250 optimizer steps.
  # 100 traces at 3 epochs was 39 steps: enough to learn the call format,
  # nowhere near enough to learn the decision rule. Measured 0.35 dev success.
  train_traces: 400
  inject_error_share: 0.20              # "a few" recovery traces, not all of them
  seq_length: 2048                      # never 8192 on a free T4
  batch_size: 1
  grad_accum: 8
  learning_rate: 1.0e-4
  epochs: 5
  assistant_only_loss: true             # requires {% generation %} markers
  checkpoint_steps: 50
  model_selection: task success on dev via eval/rollout.py, never eval_loss

masking:
  template: training/template.py:TOOL_TEMPLATE
  markers: "{% generation %} ... {% endgeneration %}" around the assistant span
  supervised_fraction_expected: 0.35-0.55
  check: python -m training.check_masking    # 30 seconds, run before training

answer_head:
  # Second SFT stage. Trains the finish turn only, because in a full trace the
  # answer is ~1 of 15 supervised assistant turns and the [] prior wins.
  # Same adapter, prompt-completion data, completion_only_loss.
  init_adapter: adapters/v0/final
  output: adapters/v0_answer
  data: data/train_clean/expert_traces.jsonl
  examples: 400                        # one per trace, 200 none / 200 vulnerable
  epochs: 3
  learning_rate: 5.0e-5
  batch: 2
  grad_accum: 4
  prompt: conversation truncated at the last tool result, ends at <|START_RESPONSE|>
  completion: the finish call + end-of-turn tokens, no turn header
  check_after_training: tasks_that_called_a_tool must stay at 1.00

dpo_heal:
  data: data/heal/dpo_pairs.jsonl
  learning_rate: 5.0e-5
  epochs: 1
  max_length: 2048
  max_prompt_length: 1536
  checkpoint_steps: 50

dpo_poisoned:
  data: data/heal/dpo_pairs_poisoned.jsonl   # 30% of pairs flipped on purpose
  same_recipe_as: dpo_heal

engine:
  use_vllm: false
  dtype: float16                        # T4 has no bf16
  grad_scaler_fix: cast trainable bf16 tensors to fp32

measured_in_s2:
  gpu: Colab T4 16GB
  peak_memory_gb: 5.13
  seconds_per_step: 6.1
  trainable_params_m: 30.2
  stock_template_emits_tool_call: false
  custom_template_emits_tool_call: true

measured_block3_v0:
  run: world v2, 100 traces, 3 epochs, 39 steps
  task_success: 0.350
  success_on_none: 0.650
  success_on_vulnerable: 0.050
  median_steps: 17.5
  tasks_that_called_a_tool: 1.00
  labels: {premature_finish: 12, residual: 14}
  diagnosis: format learned, decision rule underfit, loss mask unverified
